# research/house-renovation-demo/house-renovation.yaml — демо-план:
# ремонт интерьера двухэтажного дома, начиная с черновой стадии.
# Только структура; назначение, сроки и критический путь вычисляются.
# Имена — кириллические слаги по решению
# identifying-names-are-lowercase-latin-or-cyrillic-slugs: строчные буквы
# и цифры, дефисы-разделители, один алфавит в имени; проза — в описаниях.
unit: person-hours
start: 2026-11-05               # бригада заходит на следующий день после Дня народного единства
deadline: 2027-02-26            # семья заселяется к дачному сезону в марте

calendar:
  workdays: [mon, tue, wed, thu, fri, sat]  # стройбригада живёт шестидневкой
  holidays: [2026-11-04, 2026-12-31, 2027-01-01, 2027-01-02, 2027-01-03, 2027-01-04, 2027-01-05, 2027-01-06, 2027-01-07, 2027-01-08]
  extra-workdays: [2026-12-20]  # договорное воскресенье перед праздничным затишьем

roles:                          # словарь ролей — проверяется валидатором
  дизайнер: дизайн-проект интерьера, подбор материалов и света
  электрик: скрытая проводка, чистовые розетки, выключатели и свет
  сантехник: скрытая сантехника и вентиляция, чистовая сантехника
  отделочник: перегородки, штукатурка, стяжка пола, малярка
  плиточник: плитка в санузлах и фартук
  столяр: межкомнатные двери и чистовые полы

tasks:
  # --- случилось до появления плана: засеяно done, больше не трогаем ---
  дизайн-проект:
    status: done                # задачи done освобождены от потолка оценки
    role: дизайнер
    estimate: 40
  демонтаж:
    status: done
    description: снять старую отделку, вскрыть стены под новые трассы
    role: отделочник
    estimate: 40

  # --- черновая стадия: стены, скрытые провода и трубы, стяжки ---
  перегородки-первый-этаж:
    status: in-progress         # засеяно с интервью; дальше статус ведёт синк
    depends-on: [демонтаж]
    role: отделочник
    estimate: 40
  перегородки-второй-этаж:
    depends-on: [демонтаж]
    role: отделочник
    estimate: 32
  вентиляция:
    depends-on: [демонтаж]
    description: приточка и вытяжка, скрытые за натяжными потолками
    role: сантехник
    estimate: 24
  электрика-черновая-первый-этаж:
    depends-on: [перегородки-первый-этаж]
    role: электрик
    estimate: 40
  электрика-черновая-второй-этаж:
    depends-on: [перегородки-второй-этаж]
    role: электрик
    estimate: 36
  сантехника-черновая-первый-этаж:
    depends-on: [перегородки-первый-этаж]
    role: сантехник
    estimate: 32
  сантехника-черновая-второй-этаж:
    depends-on: [перегородки-второй-этаж]
    role: сантехник
    estimate: 28
  стяжка-первый-этаж:
    depends-on: [сантехника-черновая-первый-этаж, вентиляция]
    role: отделочник
    estimate: 40
  стяжка-второй-этаж:
    depends-on: [сантехника-черновая-второй-этаж]
    role: отделочник
    estimate: 32
  штукатурка-первый-этаж:
    depends-on: [электрика-черновая-первый-этаж, сантехника-черновая-первый-этаж]
    role: отделочник
    estimate: 56
  штукатурка-второй-этаж:
    depends-on: [электрика-черновая-второй-этаж, сантехника-черновая-второй-этаж]
    role: отделочник
    estimate: 48

  # --- подбор материалов: роль, которую может взять и дизайнер, и агент ---
  подбор-материалов:
    depends-on: [дизайн-проект]
    description: плитка, паркет, палитры красок и сантехника — сравнить и заказать
    role: дизайнер
    estimate: 24
  сценарий-освещения:
    depends-on: [дизайн-проект]
    role: дизайнер
    estimate: 16

  # --- чистовая стадия ---
  плитка-санузлы-первый-этаж:
    depends-on: [штукатурка-первый-этаж, стяжка-первый-этаж]
    role: плиточник
    estimate: 48
  плитка-санузлы-второй-этаж:
    depends-on: [штукатурка-второй-этаж, стяжка-второй-этаж]
    role: плиточник
    estimate: 40
  малярка-первый-этаж:
    depends-on: [штукатурка-первый-этаж, вентиляция]
    role: отделочник
    estimate: 48
  малярка-второй-этаж:
    depends-on: [штукатурка-второй-этаж, вентиляция]
    role: отделочник
    estimate: 40
  установка-дверей:
    status: blocked             # blocked всё равно планируется: мощность, а не правда
    blocked-reason: дверные полотна застряли у поставщика, срок поставки неизвестен
    depends-on: [стяжка-первый-этаж, стяжка-второй-этаж]
    role: столяр
    estimate: 24
  полы-чистовые-первый-этаж:
    depends-on: [стяжка-первый-этаж, малярка-первый-этаж]
    role: столяр
    estimate: 32
  полы-чистовые-второй-этаж:
    depends-on: [стяжка-второй-этаж, малярка-второй-этаж]
    role: столяр
    estimate: 24
  электрика-чистовая:
    depends-on: [малярка-первый-этаж, малярка-второй-этаж, плитка-санузлы-первый-этаж, плитка-санузлы-второй-этаж]
    description: розетки, выключатели, щиток и светильники
    role: электрик
    estimate: 32
  сантехприборы:
    depends-on: [плитка-санузлы-первый-этаж, плитка-санузлы-второй-этаж]
    role: сантехник
    estimate: 24
  уборка-и-приёмка:
    depends-on: [полы-чистовые-первый-этаж, полы-чистовые-второй-этаж, электрика-чистовая, сантехприборы, установка-дверей]
    role: отделочник
    estimate: 24

executors:
  анна:                         # дизайнер: подработка по 4 ч в день
    roles: [дизайнер]
    availability: 0.5
    ids: { trello: ANNA-7 }
  михаил:                       # отделочник, подрабатывающий плиточником
    role-weights: { отделочник: 3, плиточник: 1 }   # 6 ч отделки, 2 ч плитки в день
    availability:
      - { from: 2026-12-28, until: 2027-01-10, fraction: 0.0 }  # новогодний перерыв
  григорий:
    roles: [плиточник]
  виктор:
    roles: [электрик]
  сергей:
    roles: [сантехник]
  павел:
    roles: [столяр]
  агент-подбора:                # агент: слоты, а не часы
    roles: [дизайнер]
    concurrency: 2
    calendar: all               # работает каждый день, включая выходные
